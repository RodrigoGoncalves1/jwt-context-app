version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jwt-auth-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jwt_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - jwt-auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: jwt-auth-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - jwt-auth-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: jwt-auth-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jwt_auth}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-super-secret-access-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-change-in-production}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@jwt-auth.local
      APP_URL: http://localhost:5173
      API_PORT: 4000
    volumes:
      - ./api:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    networks:
      - jwt-auth-network
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    command: pnpm dev

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    container_name: jwt-auth-web
    environment:
      VITE_API_URL: http://localhost:4000/graphql
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - jwt-auth-network
    depends_on:
      - api
    command: pnpm dev --host

volumes:
  postgres_data:

networks:
  jwt-auth-network:
    driver: bridge
